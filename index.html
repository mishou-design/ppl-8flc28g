<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#060708">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ARETE">
  <meta name="description" content="ARETE: 6-day push/pull/legs workout logger with rest timer">
  <link rel="manifest" href="./manifest.webmanifest?v=19">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=19">
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png?v=19">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png?v=19">
  <link rel="icon" href="./favicon.ico?v=19" sizes="any">
  <link rel="preload" href="./img/cover.webp" as="image">
  <link rel="preload" href="./fonts/oswald-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="./fonts/cinzel-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="./fonts/cormorant-italic-latin.woff2" as="font" type="font/woff2" crossorigin>
  <title>ARETE</title>
  <link rel="stylesheet" href="./styles.css?v=19">
</head>
<body>
  <div class="cover" id="cover" role="button" tabindex="0" aria-label="Enter ARETE">
    <div class="cover-inner">
      <div class="cover-ring" aria-hidden="true"><span>A</span></div>
      <h1 class="cover-word">ARETE</h1>
      <p class="cover-greek" lang="el">ἀρετή</p>
      <div class="cover-rule" aria-hidden="true"></div>
      <blockquote class="cover-quote" id="cover-quote"></blockquote>
      <p class="cover-author" id="cover-author"></p>
      <p class="cover-tap">Tap to begin</p>
    </div>
  </div>
  <div class="bg" aria-hidden="true"><div class="bg-img"></div><div class="bg-img"></div><div class="bg-shade"></div></div>
  <div class="stars" aria-hidden="true"></div>
  <div class="app">
    <header class="header">
      <button type="button" class="btn-back hidden" id="header-back" aria-label="Back">‹</button>
      <h1 id="header-title" class="wordmark">ARETE</h1>
      <span class="badge hidden" id="header-badge"></span>
      <button type="button" class="btn-gear" id="header-gear" aria-label="Settings and mobility screens" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </header>

    <section class="screen active" data-screen="home">
      <div class="screen-body">
        <figure class="stoic" id="stoic-quote" title="Tap for another">
          <blockquote id="stoic-text"></blockquote>
          <figcaption id="stoic-author"></figcaption>
        </figure>
        <div class="checkin-banner" id="checkin-banner" hidden></div>
        <div class="block-banner slim" id="block-banner"></div>
        <div class="day-grid" id="day-grid"></div>
        <div class="extras" id="extras" hidden>
          <div id="discipline-card"></div>
          <div id="screens-card"></div>
          <div id="settings-card"></div>
        </div>
      </div>
    </section>

    <section class="screen" data-screen="phase">
      <div class="screen-body">
        <div class="phase-hero" id="phase-hero"></div>
        <div class="day-grid" id="phase-days"></div>
      </div>
    </section>

    <section class="screen" data-screen="session">
      <div class="screen-body">
        <div class="block-status" id="block-status"></div>
        <div class="week-row" id="week-row" role="tablist" aria-label="Week"></div>
        <div id="lifts"></div>
      </div>
    </section>
  </div>

  <div class="timer-bar" id="timer-bar" role="timer" aria-live="polite">
    <div class="timer-main">
      <div class="ring-wrap">
        <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
          <circle class="ring-track" cx="60" cy="60" r="52"></circle>
          <circle class="ring-fill" id="timer-ring" cx="60" cy="60" r="52"></circle>
        </svg>
        <div class="timer-countdown" id="timer-countdown">2:00</div>
      </div>
      <div class="timer-side">
        <div class="timer-label" id="timer-label">Rest · T-minus</div>
        <div class="timer-actions">
          <button type="button" class="btn-minus" id="btn-minus" aria-label="Minus 15 seconds">−15</button>
          <button type="button" class="btn-plus" id="btn-plus" aria-label="Plus 15 seconds">+15</button>
          <button type="button" class="btn-pause" id="btn-pause">Pause</button>
          <button type="button" class="btn-skip" id="btn-skip">Skip</button>
        </div>
        <div class="timer-presets">
          <button type="button" class="preset-btn" data-sec="60">60s</button>
          <button type="button" class="preset-btn" data-sec="90">90s</button>
          <button type="button" class="preset-btn" data-sec="120">120s</button>
        </div>
      </div>
    </div>
  </div>

  <div class="sheet-backdrop" id="video-backdrop"></div>
  <div class="sheet" id="video-sheet" role="dialog" aria-modal="true" aria-labelledby="video-title">
    <div class="sheet-grab" id="video-grab">
      <div class="sheet-handle"></div>
      <div class="sheet-head">
        <div class="sheet-title" id="video-title">How-to</div>
        <button type="button" class="sheet-close" id="video-close" aria-label="Close video">✕</button>
      </div>
    </div>
    <div class="video-frame">
      <iframe id="video-iframe" src="about:blank" title="Exercise video" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
    </div>
    <a class="btn-heavy" id="video-open" href="#" target="_blank" rel="noopener">Open in YouTube</a>
    <p class="sheet-note">Video won't load? Open it in YouTube. Swipe down or tap outside to close.</p>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="./app.js?v=19"></script>
</body>
</html>
