<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#060708">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ARETE">
  <meta name="description" content="ARETE: 6-day push/pull/legs workout logger with rest timer">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="preload" href="./fonts/oswald-latin.woff2" as="font" type="font/woff2" crossorigin>
  <title>ARETE</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="stars" aria-hidden="true"></div>
  <div class="app">
    <header class="header">
      <button type="button" class="btn-back hidden" id="header-back" aria-label="Back">‹</button>
      <h1 id="header-title" class="wordmark">ARETE</h1>
      <span class="badge hidden" id="header-badge"></span>
    </header>

    <section class="screen active" data-screen="home">
      <div class="screen-body">
        <p class="tagline" lang="el">ἀρετή <span>· excellence</span></p>
        <p class="greeting">Let's work.</p>
        <div class="block-banner" id="block-banner"></div>
        <p class="subtitle">Choose today's mission · logs stay on this phone</p>
        <div class="day-grid" id="day-grid"></div>
        <div id="screens-card"></div>
        <div id="settings-card"></div>
        <p class="footer-hint">New lifts every 3 weeks · mobility warm-up each day · works offline</p>
      </div>
    </section>

    <section class="screen" data-screen="session">
      <div class="screen-body">
        <div class="block-status" id="block-status"></div>
        <div class="week-row" id="week-row" role="tablist" aria-label="Week"></div>
        <div id="lifts"></div>
      </div>
    </section>
  </div>

  <div class="timer-bar" id="timer-bar" role="timer" aria-live="polite">
    <div class="timer-main">
      <div class="ring-wrap">
        <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
          <circle class="ring-track" cx="60" cy="60" r="52"></circle>
          <circle class="ring-fill" id="timer-ring" cx="60" cy="60" r="52"></circle>
        </svg>
        <div class="timer-countdown" id="timer-countdown">2:00</div>
      </div>
      <div class="timer-side">
        <div class="timer-label" id="timer-label">Rest · T-minus</div>
        <div class="timer-actions">
          <button type="button" class="btn-minus" id="btn-minus" aria-label="Minus 15 seconds">−15</button>
          <button type="button" class="btn-plus" id="btn-plus" aria-label="Plus 15 seconds">+15</button>
          <button type="button" class="btn-pause" id="btn-pause">Pause</button>
          <button type="button" class="btn-skip" id="btn-skip">Skip</button>
        </div>
        <div class="timer-presets">
          <button type="button" class="preset-btn" data-sec="60">60s</button>
          <button type="button" class="preset-btn" data-sec="90">90s</button>
          <button type="button" class="preset-btn" data-sec="120">120s</button>
        </div>
      </div>
    </div>
  </div>

  <div class="sheet-backdrop" id="video-backdrop"></div>
  <div class="sheet" id="video-sheet" role="dialog" aria-modal="true" aria-labelledby="video-title">
    <div class="sheet-grab" id="video-grab">
      <div class="sheet-handle"></div>
      <div class="sheet-head">
        <div class="sheet-title" id="video-title">How-to</div>
        <button type="button" class="sheet-close" id="video-close" aria-label="Close video">✕</button>
      </div>
    </div>
    <div class="video-frame">
      <iframe id="video-iframe" src="about:blank" title="Exercise video" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
    </div>
    <a class="btn-heavy" id="video-open" href="#" target="_blank" rel="noopener">Open in YouTube</a>
    <p class="sheet-note">Video won't load? Open it in YouTube. Swipe down or tap outside to close.</p>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="./app.js"></script>
</body>
</html>
